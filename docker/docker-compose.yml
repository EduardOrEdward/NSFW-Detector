services:
  nsfw-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes: 
      - ../data/models/:/app/data/models
    container_name: nsfw-detector-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TF_CPP_MIN_LOG_LEVEL=3
      - TF_ENABLE_ONEDNN_OPTS=0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nsfw-network
    deploy:
      resources:
        limits:
          cpus: '1.8'
          memory: 5G
        reservations:
          cpus: '1.0'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: nsfw-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nsfw-network
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  redis-data:

networks:
  nsfw-network:
    driver: bridge