version: '3.8'
services:
  nsfw-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nsfw-detector-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - UVICORN_WORKERS=4
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nsfw-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: nsfw-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nsfw-network

volumes:
  redis-data:

networks:
  nsfw-network:
    driver: bridge